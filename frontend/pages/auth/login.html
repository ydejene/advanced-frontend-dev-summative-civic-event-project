<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to your CivicEvents account to register for events and stay connected.">
  <title>Log In — CivicEvents</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/output.css">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/civicevents-mark.svg">
</head>
<body class="font-body bg-off-white flex flex-col min-h-screen">

  <div id="site-header"></div>

  <main class="flex-1 flex items-center justify-center py-12 px-4" id="main-content">
    <div class="w-full max-w-sm">

      <!-- Logo mark -->
      <div class="text-center mb-8">
        <a href="/index.html" class="inline-block focus-visible:outline-2 focus-visible:outline-teal rounded">
          <img src="/assets/icons/civicevents-mark.svg"
               alt="CivicEvents"
               class="h-12 w-auto mx-auto mb-3">
        </a>
        <h1 class="font-heading text-2xl font-bold text-deep-teal">Welcome back</h1>
        <p class="mt-1 text-sm text-gray-500">Log in to your CivicEvents account</p>
      </div>

      <!-- Login card -->
      <div class="card p-6">
        <!-- Success status banner (e.g. after signup) -->
        <div id="form-success" class="mb-4 p-3 rounded-md bg-green-50 border border-green-200 text-sm text-green-800 hidden" role="status"></div>

        <!-- Error status banner -->
        <div id="form-error" class="mb-4 p-3 rounded-md bg-red-50 border border-red-200 text-sm text-red-700 hidden" role="alert"></div>

        <form id="login-form" novalidate aria-label="Login form">

          <div class="mb-4">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email"
                   class="form-input" placeholder="you@example.com" required
                   aria-describedby="email-error">
            <p class="form-error hidden" id="email-error" role="alert"></p>
          </div>

          <div class="mb-6">
            <label for="password" class="form-label">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" autocomplete="current-password"
                     class="form-input pr-10" placeholder="••••••••" required
                     aria-describedby="password-error">
              <button type="button" id="toggle-password-btn" data-target="password"
                      class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-teal focus:outline-none focus-visible:ring-2 focus-visible:ring-teal rounded-r-md cursor-pointer"
                      aria-label="Show password" aria-pressed="false">
                <!-- Eye icon (shown when password is hidden) -->
                <svg class="w-5 h-5 eye-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
                <!-- Eye-slash icon (shown when password is plain text) -->
                <svg class="w-5 h-5 eye-slash-icon hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                </svg>
              </button>
            </div>
            <p class="form-error hidden" id="password-error" role="alert"></p>
          </div>

          <button type="submit" class="btn-primary w-full justify-center py-3" id="login-btn">
            Log in
          </button>

        </form>
      </div>

      <p class="mt-5 text-center text-sm text-gray-500">
        Don't have an account?
        <a href="/pages/auth/signup.html" class="text-teal font-medium hover:text-deep-teal">Sign up</a>
      </p>

    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/node_modules/jquery/dist/jquery.min.js"></script>
  <script type="module" src="/js/pages/login.js"></script>

</body>
</html>
